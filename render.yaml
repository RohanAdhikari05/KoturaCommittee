services:
  - type: web
    name: kotura-committee
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
